name: Ema
description: >-
  Ema is an enterprise "AI Employee" platform that builds autonomous agents to
  automate cross-functional workflows across HR, IT, Finance, customer support
  and healthcare operations. Its Autopilot builder turns plain-language
  descriptions into working AI Employees, EmaFusion combines 100+ AI models to
  optimize accuracy, cost and latency, and 1,000+ prebuilt connectors integrate
  with enterprise systems. Ema exposes a Builder Platform API (REST/JSON plus a
  gRPC-Web path) covering AI Employee, Chat, Workflow, Dashboard, Document
  Generation and tenant-management operations, secured by a two-step API-key to
  short-lived JWT flow, along with an Embeddable Chat SDK. The company is backed
  by Accel and Prosus Ventures.
